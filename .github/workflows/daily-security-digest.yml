name: Daily security digest

on:
  schedule:
    # Off-peak minute (see hourly-digest.yml's note on cron minute 0 being
    # GitHub's most congested slot). The script computes its own 24h window,
    # so the exact fire time only matters for reliability, not correctness.
    - cron: "23 7 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the digest but do not send email"
        type: boolean
        default: false
      test_email:
        description: "Send one canned test email via Resend and exit (skips Railway/change-detection)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-security-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      DIGEST_EMAIL_TO: ${{ secrets.DIGEST_EMAIL_TO }}
      RAILWAY_SERVICE_ID: d39f0a0b-a7e1-4295-a9a1-76347dedc68d
      RAILWAY_ENVIRONMENT_ID: 1ec0b318-e237-44d2-8919-7e6807de0b8b
      GATEWAY_URL: https://garmin.metalevels.net
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "httpx>=0.27"
      # Cross-run baseline for account/token/client counts. The gateway's own
      # dedup for the `stats` log line is process-local and resets on every
      # restart (redeploy, crash, anything) -- without a REAL baseline here,
      # any restart looks like a change. "Mutable cache" idiom: save under a
      # run-unique key, restore via the shared prefix to always get the latest.
      - name: Restore digest state
        if: "!(github.event_name == 'workflow_dispatch' && inputs.test_email)"
        uses: actions/cache/restore@v4
        with:
          path: digest-state.json
          key: daily-digest-state-${{ github.run_id }}
          restore-keys: |
            daily-digest-state-
      - name: Run digest
        run: >
          python scripts/daily_security_digest.py
          ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
          ${{ (github.event_name == 'workflow_dispatch' && inputs.test_email) && '--test-email' || '' }}
      - name: Save digest state
        # digest-state.json only exists when a `stats` event actually fired
        # this window (see save_state() in the script) -- a totally quiet
        # window (no stats, no restart) leaves nothing to cache. Guard on the
        # file's existence so that's a skipped step, not a yellow "cache save
        # failed" warning on an otherwise clean run.
        if: >
          always() && !(github.event_name == 'workflow_dispatch' && inputs.test_email)
          && hashFiles('digest-state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: digest-state.json
          key: daily-digest-state-${{ github.run_id }}
