name: Hourly health digest

# Disabled: no schedule trigger. This workflow posts to Slack, and this
# deployment doesn't use Slack (SLACK_WEBHOOK_URL is intentionally unset) --
# scheduling it would just fail hourly on the missing secret. Left runnable
# via workflow_dispatch in case Slack alerting is wanted again later; the
# daily security digest (email, changes-only) covers this deployment instead.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the digest but do not post to Slack"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read   # the script lists today's runs to catch up a skipped heartbeat

concurrency:
  group: hourly-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      GITHUB_TOKEN: ${{ github.token }}   # heartbeat catch-up (list prior runs)
      RAILWAY_SERVICE_ID: d39f0a0b-a7e1-4295-a9a1-76347dedc68d
      RAILWAY_ENVIRONMENT_ID: 1ec0b318-e237-44d2-8919-7e6807de0b8b
      GATEWAY_URL: https://garmin.metalevels.net
      # HEARTBEAT_HOUR / REPORT_TZ / ANOMALY_MIN use the script defaults
      # (08:00 Europe/Prague, >=3). Override here if needed.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "httpx>=0.27"
      - name: Run digest
        run: >
          python scripts/hourly_digest.py
          ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
